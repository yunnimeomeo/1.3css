<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>My Profile Page</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header class="header">
      <h1 class="title">My Profile</h1>
      <p class="subtitle">My Nguyen</p>
    </header>

    <main class="container">
      <section class="box">
        <h3 class="heading">About Me</h3>
        <p class="text">
          I enjoy talking and playing games with my friends. I often share stories
          about things that happen in my life with them.
        </p>
      </section>

      <section class="box">
        <h3 class="heading">My Hobbies</h3>
        <ul class="list">
          <li>Playing games</li>
          <li>Cooking</li>
          <li>Listening to music</li>
        </ul>
      </section>

      <section class="box">
        <h3 class="heading">Fun Facts</h3>
        <p class="highlight">
          I can talk in voice chat for hours and never get bored.
        </p>
      </section>
    </main>
  </body>
</html>
